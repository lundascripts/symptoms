name: Build APK

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: npm install
        run: npm ci

      - name: www/ bauen und Android-Plattform initialisieren
        run: |
          node build.js
          npx cap add android
          npx cap sync android

      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x android/gradlew

      - name: Debug-APK bauen
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: |
          DATE=$(date +'%Y-%m-%d')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "symptom-tagebuch-${DATE}-${SHORT_SHA}.apk"
          echo "APK_NAME=symptom-tagebuch-${DATE}-${SHORT_SHA}.apk" >> $GITHUB_ENV

      - name: Release erstellen und APK hochladen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: "Symptom-Tagebuch ${{ env.APK_NAME }}"
          files: ${{ env.APK_NAME }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
